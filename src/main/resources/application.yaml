server:
  port: ${CHATBOT_SERVICE_PORT:9004}

spring:
  application:
    name: chatbot-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./.env[.properties]
      - optional:file:chatbot-service/.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  secret-key: ${JWT_SECRET_KEY:5c4b406804cf14ef2fea719598e07d7d7c6c15d26eea55040597cb2ab6a6d35b}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
